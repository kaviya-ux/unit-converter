<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Unit Converter</h1>
    <p class="text-slate-500 text-sm mb-6">Convert length, weight and temperature values instantly.</p>

    <!-- Category buttons -->
    <div class="flex gap-2 mb-6">
      <button onclick="setCategory('length')" id="btn-length"
        class="category-btn flex-1 py-2 rounded-lg text-sm font-medium border">Length</button>
      <button onclick="setCategory('weight')" id="btn-weight"
        class="category-btn flex-1 py-2 rounded-lg text-sm font-medium border">Weight</button>
      <button onclick="setCategory('temperature')" id="btn-temperature"
        class="category-btn flex-1 py-2 rounded-lg text-sm font-medium border">Temp</button>
    </div>

    <!-- Input -->
    <div class="mb-4">
      <label class="block text-sm text-slate-600 mb-1">Value</label>
      <input type="number" id="inputValue" value="1"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
    </div>

    <!-- From / To selects -->
    <div class="flex items-center gap-3 mb-6">
      <select id="fromUnit" class="flex-1 border border-slate-300 rounded-lg px-2 py-2"></select>
      <span class="text-slate-400">→</span>
      <select id="toUnit" class="flex-1 border border-slate-300 rounded-lg px-2 py-2"></select>
    </div>

    <!-- Result -->
    <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
      <span id="result" class="text-2xl font-semibold text-slate-800">—</span>
    </div>
  </div>

  <script>
    // Base units: length -> meters, weight -> grams, temperature -> celsius (special-cased)
    const units = {
      length: {
        base: 'meter',
        options: {
          meter: 1,
          kilometer: 1000,
          centimeter: 0.01,
          millimeter: 0.001,
          mile: 1609.34,
          yard: 0.9144,
          foot: 0.3048,
          inch: 0.0254
        }
      },
      weight: {
        base: 'gram',
        options: {
          gram: 1,
          kilogram: 1000,
          milligram: 0.001,
          pound: 453.592,
          ounce: 28.3495
        }
      },
      temperature: {
        base: 'celsius',
        options: { celsius: 1, fahrenheit: 1, kelvin: 1 } // handled separately
      }
    };

    let currentCategory = 'length';

    function setCategory(category) {
      currentCategory = category;

      // highlight active button
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white', 'border-slate-800');
        btn.classList.add('border-slate-300', 'text-slate-600');
      });
      const activeBtn = document.getElementById('btn-' + category);
      activeBtn.classList.add('bg-slate-800', 'text-white', 'border-slate-800');
      activeBtn.classList.remove('border-slate-300', 'text-slate-600');

      // populate dropdowns
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const optionNames = Object.keys(units[category].options);
      optionNames.forEach((name, i) => {
        const label = name.charAt(0).toUpperCase() + name.slice(1);
        fromSelect.innerHTML += `<option value="${name}">${label}</option>`;
        toSelect.innerHTML += `<option value="${name}">${label}</option>`;
      });

      // default: first unit -> second unit
      toSelect.selectedIndex = optionNames.length > 1 ? 1 : 0;

      convert();
    }

    function convert() {
      const value = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const resultEl = document.getElementById('result');

      if (isNaN(value)) {
        resultEl.textContent = '—';
        return;
      }

      let output;

      if (currentCategory === 'temperature') {
        output = convertTemperature(value, from, to);
      } else {
        const table = units[currentCategory].options;
        const valueInBase = value * table[from];
        output = valueInBase / table[to];
      }

      // trim to a reasonable number of decimals
      resultEl.textContent = `${roundNicely(output)} ${to}`;
    }

    function convertTemperature(value, from, to) {
      if (from === to) return value;

      // convert "from" to celsius first
      let celsius;
      if (from === 'celsius') celsius = value;
      else if (from === 'fahrenheit') celsius = (value - 32) * (5 / 9);
      else if (from === 'kelvin') celsius = value - 273.15;

      // convert celsius to "to"
      if (to === 'celsius') return celsius;
      if (to === 'fahrenheit') return celsius * (9 / 5) + 32;
      if (to === 'kelvin') return celsius + 273.15;
    }

    function roundNicely(num) {
      return Math.round(num * 10000) / 10000;
    }

    // event listeners
    document.getElementById('inputValue').addEventListener('input', convert);
    document.getElementById('fromUnit').addEventListener('change', convert);
    document.getElementById('toUnit').addEventListener('change', convert);

    // init
    setCategory('length');
  </script>

</body>
</html>
